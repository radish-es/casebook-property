baseURL: https://property.opensourcelaw.ca/
title: |
  (Re)Making Canada: Property Problems, Cases & Materials

# Hugo Book theme as a Hugo module

module:
  imports:
  # - path: github.com/radish-es/casebook-layouts
  # - path: github.com/radish-es/casebook-property-modules
  #   mounts:
  #   - source: content/cases
  #     target: content/cases
  - path: github.com/alex-shpak/hugo-book

# Book configuration
#disablePathToLower: true

enableGitInfo: true

params:
  BookTheme: "light"
  BookToC: true
  BookSection: "*"
  BookDateFormat: "January 2, 2006"
  # BookLogo: /logo.png
  # BookMenuBundle: /menu

markup:
  goldmark:
    renderer:
      unsafe: true

taxonomies:
  doctrine: doctrines

# Added to generate markdown links

mediaTypes:
  text/markdown:
    suffixes:
      - md

outputFormats:
  Markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true

outputs:
  page:
    - HTML
    - Markdown